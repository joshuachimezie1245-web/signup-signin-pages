<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SIGN IN</title>
</head>
<body>
    <main>
            <div class="form-box">
                <h1>Welcome Back</h1>
                <p class="subtittle">Please enter your details to sign in</p>
            <form action="">
                <div class="input-label">
                    <label for="email">Email Adress</label>
                    <input type="email" name="Email" id="email" placeholder="enter your email">
                </div>
                <div class="input-label">
                    <label for="password">Password</label>
                    <input type="password" name="Password" id="password" placeholder="8 characters" minlength="8" maxlength="8">
                </div>
                    <a href="" class="forgot">Forgot password</a>
                <div>
                    <button type="submit" class="sign-btn " id="wer">Sign In</button>
                </div>
            </form>
            <p class="change-text">
                Don`t have an account?
            <a href="./signup.html" class="log-in" target="_blank">Sign-Up</a>
            </p>
            </div>
    </main>
</body>
</html>
