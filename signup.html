<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SIGN UP</title>
</head>

<body>
    <main>
        <div class="box">
            <h1>Creat Account</h1>
            <p class="subtittle">join us today by filling out you info</p>
        <form action="">
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input type="text" name="signup-fullname" id="fullname">
            </div>
            <div class="input-group">
                <label for="email">Email Adress</label>
                <input type="email" name="signup-email" id="email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" name="signup-Password" id="password">
            </div>
            <div>
                <button type="submit" class="signup-btn">Sign up</button>
            </div>
        </form>
        <p class="switch-text">
            Already have an account?
            <a href="./signin.html" class="switch-link">Sign-in</a>
        </p>
    </main>

</body>

</html>
